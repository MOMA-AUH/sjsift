name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Exercise minimum supported pysam on Python 3.11
        if: matrix.python-version == '3.11'
        run: python -m pip install "pysam==0.24.0"
      - run: python -m pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sjsift-wheel-test"
          "$RUNNER_TEMP/sjsift-wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/sjsift-wheel-test/bin/python" -c "import sjsift"
          "$RUNNER_TEMP/sjsift-wheel-test/bin/sjsift" --help
          "$RUNNER_TEMP/sjsift-wheel-test/bin/sjsift" --version
          touch "$RUNNER_TEMP/sjsift-empty.SJ.out.tab"
          "$RUNNER_TEMP/sjsift-wheel-test/bin/sjsift" \
            --junctions "$RUNNER_TEMP/sjsift-empty.SJ.out.tab" \
            --definitions definitions/grch38.toml \
            --output "$RUNNER_TEMP/sjsift-smoke.tsv" \
            --html-output "$RUNNER_TEMP/sjsift-smoke.html"
          PATH="$RUNNER_TEMP/sjsift-wheel-test/bin:$PATH" "$RUNNER_TEMP/sjsift-wheel-test/bin/python" tests/installed_alignment_smoke.py

  conda:
    name: conda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: sjsift-build
          channels: conda-forge,bioconda
          channel-priority: strict
          python-version: "3.14"
          use-mamba: true
      - name: Build and test installed conda package with alignment evidence
        shell: bash -el {0}
        run: |
          conda install --yes --override-channels --channel conda-forge conda-build
          conda-build --override-channels --channel conda-forge --channel bioconda --no-anaconda-upload conda-recipe/
