{% set name = "sjsift" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77
  run:
    - python >=3.11
    - pysam >=0.24.0,<0.25

test:
  source_files:
    - tests/alignment_fixtures.py
    - tests/installed_alignment_smoke.py
  imports:
    - sjsift
  commands:
    - sjsift --help
    - sjsift --version
    - python tests/installed_alignment_smoke.py

about:
  home: https://github.com/MOMA-AUH/sjsift
  summary: Quantify predefined RNA splice variants from STAR junctions
  license: MIT
  license_file: LICENSE
